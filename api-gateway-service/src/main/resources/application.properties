# Log Settings

#server.error.include-stacktrace=never
server.error.include-message = always

# App Settings
apiPrefix = /v1
restPrefix = /rest

# Server Settings
# <code>http://localhost:8763/api-gateway-service</code>
#
spring.application.name = ${API_GATEWAY_SERVICE_NAME:api-gateway-service}
server.port = ${API_GATEWAY_SERVICE_PORT:8763}
# Note: Spring Cloud Gateway uses reactive stack (WebFlux), not servlet stack
# Context path configuration for Gateway is different - use spring.cloud.gateway.base-path if needed
#management.server.port = 8085
#management.server.address = 127.0.0.1

# Spring Cloud Gateway Configuration
# Gateway automatically discovers services from Eureka
# Routes can be configured here or via code
spring.cloud.gateway.discovery.locator.enabled = true
spring.cloud.gateway.discovery.locator.lower-case-service-id = true
# Strip prefix for discovery locator routes (default: true)
# Custom routes can override this behavior
spring.cloud.gateway.discovery.locator.strip-prefix = true

# Spring Cloud Gateway Codec Configuration
# Increase max in-memory buffer size for request/response bodies (default: 256KB)
# This is needed for large file uploads through the gateway
spring.codec.max-in-memory-size = ${GATEWAY_MAX_IN_MEMORY_SIZE:10MB}

# Compatibility Check
# Note: Spring Boot 3.5.7 is not officially compatible with Spring Cloud 2024.0.0
# Spring Cloud 2024.0.0 supports Spring Boot 3.4.x
# Disabling compatibility check as a workaround. For production, consider using Spring Boot 3.4.7
spring.cloud.compatibility-verifier.enabled = false

# Add a spring.config.import=configserver: property to your configuration.
#  If configuration is not required add spring.config.import=optional:configserver: instead.
# To disable this check, set spring.cloud.config.enabled=false or
# spring.cloud.config.import-check.enabled=false.
# The Config Server needs to know which repository to manage
#The location in the import property has precedence over the uri property.
spring.config.import = optional:configserver:http://${CONFIG_SERVICE_HOST:localhost}:${config.service.port}/

# end point of load balancing server (registry service)
eureka.client.service-url.default-zone = ${REGISTRY_SERVICE_URL:http://${eureka.instance.hostname}:${registry.service.port}/eureka/}
