# http://localhost:8761/eureka/
spring.application.name = ${CONFIG_SERVICE_NAME:config-service}
# Default Port: 8888
server.port = ${CONFIG_SERVICE_PORT:8116}
spring.cloud.config.server.git.uri = ${HOME}/Downloads/AppData/ConfigService

# Compatibility Check
# Note: Spring Boot 3.5.7 is not officially compatible with Spring Cloud 2024.0.0
# Spring Cloud 2024.0.0 supports Spring Boot 3.4.x
# Disabling compatibility check as a workaround. For production, consider using Spring Boot 3.4.7
spring.cloud.compatibility-verifier.enabled = false

# Eureka Client Configuration
# Registry service port (default: 8761)
registry.service.port = ${REGISTRY_SERVICE_PORT:8761}
# Eureka Instance Configuration
eureka.instance.hostname = ${EUREKA_INSTANCE_HOSTNAME:localhost}
# Endpoint of load balancing server (registry service)
eureka.client.service-url.default-zone = ${REGISTRY_SERVICE_URL:http://${eureka.instance.hostname}:${registry.service.port}/eureka/}
