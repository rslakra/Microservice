# Log Settings

#The bean 'jpaAuditingHandler', defined in null, could not be registered.
# A bean with that name has already been defined in null and overriding is disabled.
#spring.main.allow-bean-definition-overriding=true
# Therefore, database queries may be performed during view rendering.
# Explicitly configure spring.jpa.open-in-view to disable this warning
# spring.jpa.open-in-view is enabled by default.
spring.jpa.open-in-view = false
#server.error.include-stacktrace=never
server.error.include-message = always

# App Settings
apiPrefix = /v1
restPrefix = /rest

# Server Settings
# <code>http://localhost:8084/product-service</code>
#
spring.application.name = ${PRODUCT_SERVICE_NAME:product-service}
server.servlet.contextPath = /${spring.application.name}
server.port = ${PRODUCT_SERVICE_PORT:8084}
#management.server.port = ${PRODUCT_SERVICE_MANAGEMENT_PORT:8083}
#management.server.address = 127.0.0.1
#
#debug=true
spring.jpa.show-sql = false
# JPA Naming Strategy - Use physical naming strategy to preserve exact column names
spring.jpa.hibernate.naming.physical-strategy = org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto = create-drop
#
# Hikari Settings
#
spring.datasource.hikari.maximumPoolSize = 2
#
# H2 Database Settings
#
spring.datasource.url = jdbc:h2:file:~/Downloads/H2DB/ProductService;AUTO_SERVER=TRUE;
spring.datasource.driverClassName = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password =
spring.jpa.database-platform = org.hibernate.dialect.H2Dialect
#
# H2 Console Settings
# <code>http://localhost:8084/product-service/h2</code>
#
# Enabling H2 Console
spring.h2.console.enabled = true
# Custom H2 Console URL
spring.h2.console.path = /h2
#spring.h2.console.settings.web-allow-others=true
#spring.jpa.defer-datasource-initialization = true
#
# Liquibase Settings
#
#spring.liquibase.enabled = false
#spring.liquibase.drop-first = true
spring.liquibase.change-log = classpath:db/changelog/dbchangelog.xml
#
# Spring Chain Strategy Settings
#
# To use cache busting, the following configuration will configure a cache busting solution for all static
# resources, effectively adding a content hash in URLs,
# such as <link href="/css/spring-2a2d595e6ed9a0b24f027f2b63b134d6.css"/>:
spring.web.resources.chain.strategy.content.enabled = true
spring.web.resources.chain.strategy.content.paths = /**

# Multipart File Upload Settings
# Maximum size for a single file (default: 100MB)
# Can be overridden with environment variable: MAX_FILE_SIZE
spring.servlet.multipart.max-file-size = ${MAX_FILE_SIZE:500MB}
# Maximum size for the entire request (default: 500MB)
# Can be overridden with environment variable: MAX_REQUEST_SIZE
spring.servlet.multipart.max-request-size = ${MAX_REQUEST_SIZE:500MB}
# Enable multipart uploads (default: true)
spring.servlet.multipart.enabled = true

# Tomcat/Embedded Server Request Size Settings
# Maximum size of the HTTP post content (default: 2MB, increased for large uploads)
# This affects the total request size including headers
server.tomcat.max-http-post-size = ${TOMCAT_MAX_POST_SIZE:500MB}
# Maximum size of the HTTP form content (default: 200KB, increased for large uploads)
server.tomcat.max-http-form-post-size = ${TOMCAT_MAX_FORM_POST_SIZE:500MB}


# Add a spring.config.import=configserver: property to your configuration.
#  If configuration is not required add spring.config.import=optional:configserver: instead.
# To disable this check, set spring.cloud.config.enabled=false or
# spring.cloud.config.import-check.enabled=false.
# The Config Server needs to know which repository to manage
#The location in the import property has precedence over the uri property.
spring.config.import = optional:configserver:http://${CONFIG_SERVICE_HOST:localhost}:${config.service.port}/

# end point of load balancing server (registry service)
eureka.client.service-url.default-zone = ${REGISTRY_SERVICE_URL:http://${eureka.instance.hostname}:${registry.service.port}/eureka/}

# Compatibility Check
# Note: Spring Boot 3.5.7 is not officially compatible with Spring Cloud 2024.0.0
# Spring Cloud 2024.0.0 supports Spring Boot 3.4.x
# Disabling compatibility check as a workaround. For production, consider using Spring Boot 3.4.7
spring.cloud.compatibility-verifier.enabled = false

